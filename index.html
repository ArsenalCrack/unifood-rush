<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniFood Rush</title>
  <!-- Carga de Phaser 4 vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #000000; display: flex;
           justify-content: center; align-items: center; height: 100vh; height: 100dvh;
           overflow: hidden; touch-action: none; }
    /* El contenedor ocupa toda la ventana. El juego sigue siendo de 960 x 540 con escala FIT:
       Phaser lo agranda o lo achica sin deformarlo (16:9) y centra el lienzo. */
    #game-container { width: 100vw; height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
